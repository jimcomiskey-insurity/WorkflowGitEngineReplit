<div class="dialog-overlay" (click)="handleClose()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h2>{{ mode === 'create' ? 'Create Program' : 'Edit Program' }}</h2>
      <button class="btn-icon" (click)="handleClose()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form (ngSubmit)="handleSubmit()">
      <div class="dialog-content">
        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="form-group">
          <label for="program-id">Program ID</label>
          <input
            type="text"
            id="program-id"
            [(ngModel)]="programId"
            name="programId"
            placeholder="e.g., auto-insurance"
            [disabled]="mode === 'edit'"
            required
          />
          <small *ngIf="mode === 'create'" class="hint">
            Lowercase letters, numbers, and hyphens only. Cannot be changed later.
          </small>
          <small *ngIf="mode === 'edit'" class="hint">
            Program ID cannot be changed
          </small>
        </div>

        <div class="form-group">
          <label for="program-name">Program Name</label>
          <input
            type="text"
            id="program-name"
            [(ngModel)]="programName"
            name="programName"
            placeholder="e.g., Auto Insurance"
            required
          />
        </div>

        <div class="form-group">
          <label for="program-description">Description</label>
          <textarea
            id="program-description"
            [(ngModel)]="programDescription"
            name="programDescription"
            placeholder="Brief description of this insurance program"
            rows="3"
          ></textarea>
        </div>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn-secondary" (click)="handleClose()" [disabled]="isSubmitting">
          Cancel
        </button>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : (mode === 'create' ? 'Create Program' : 'Save Changes') }}
        </button>
      </div>
    </form>
  </div>
</div>
