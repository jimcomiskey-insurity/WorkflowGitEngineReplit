<div class="page-container">
  <div class="page-header">
    <div>
      <h1>Assets</h1>
      <p class="page-subtitle">Manage your insurance program assets</p>
    </div>
    <button class="primary" (click)="createNewAsset()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      New Asset
    </button>
  </div>

  <div class="asset-grid">
    <div class="asset-card" *ngFor="let asset of activeAssets">
      <div class="asset-card-header">
        <div class="asset-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
            <polyline points="13 2 13 9 20 9"/>
          </svg>
        </div>
        <div class="asset-info">
          <div class="asset-title-row">
            <h3>{{ asset.name }}</h3>
            <span *ngIf="asset.gitStatus && asset.gitStatus !== 'unmodified'" 
                  class="git-badge" 
                  [ngClass]="getGitStatusClass(asset.gitStatus)">
              {{ getGitStatusLabel(asset.gitStatus) }}
            </span>
          </div>
        </div>
        <div class="asset-card-actions">
          <button class="icon-button" (click)="editAsset(asset.id)" title="Edit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
          <button class="icon-button danger" (click)="deleteAsset(asset.id, asset.name)" title="Delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>

      <p class="asset-description">{{ asset.description }}</p>

      <div class="asset-tags" *ngIf="asset.tags && asset.tags.length > 0">
        <span class="tag" *ngFor="let tag of asset.tags">{{ tag }}</span>
      </div>

      <div class="asset-meta">
        <div *ngIf="asset.fileName" class="file-info">
          <span class="file-type-badge" [attr.data-type]="getFileTypeIcon(asset.fileType)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
              <polyline points="13 2 13 9 20 9"/>
            </svg>
          </span>
          <span class="file-name">{{ asset.fileName }}</span>
          <span class="file-size" *ngIf="asset.fileSizeBytes">{{ formatFileSize(asset.fileSizeBytes) }}</span>
        </div>
        <div *ngIf="!asset.fileName" class="no-file">
          <span>No file attached</span>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="activeAssets.length === 0" class="empty-state">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
      <polyline points="13 2 13 9 20 9"/>
    </svg>
    <p>No assets found</p>
    <button class="primary" (click)="createNewAsset()">Create Your First Asset</button>
  </div>
</div>
